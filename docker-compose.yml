services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Applies migrations/ once, then exits; the API waits for it.
  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://relay:relay@postgres:5432/relay?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      PORT: 8080
      DATABASE_URL: postgres://relay:relay@postgres:5432/relay?sslmode=disable
      LOG_LEVEL: info
      RELAY_ENV: ${RELAY_ENV:?set RELAY_ENV in .env (live or test)}
      # Providers are optional (configure at least one); the API validates them at startup.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_REDIRECT_URL: ${MICROSOFT_REDIRECT_URL:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      MICROSOFT_EXPIRATION_DATE: ${MICROSOFT_EXPIRATION_DATE:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      REFRESH_AHEAD: ${REFRESH_AHEAD:-10m}
      REFRESH_CONCURRENCY: ${REFRESH_CONCURRENCY:-8}
      # Empty disables push. Set a public https origin to subscribe calendars.
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"

  # UI for Postgres: docker compose --profile tools up -d adminer
  # Open http://localhost:8081  → System: PostgreSQL, Server: postgres, User/Pass/DB: relay
  adminer:
    image: adminer:4
    profiles: ["tools"]
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

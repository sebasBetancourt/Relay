name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # The release workflow runs this whole pipeline before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgres://relay:relay@localhost:5432/relay?sslmode=disable
      TEST_DATABASE_URL: postgres://relay:relay@localhost:5432/relay?sslmode=disable
      NATS_URL: nats://127.0.0.1:4222
      TEST_REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Start NATS JetStream
        # Service containers cannot pass -js: GitHub Actions has no command
        # override, and they start before checkout so a config file cannot
        # be mounted. The official image enables JetStream only with -js.
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 \
            nats:2.11.17-alpine -js -m 8222 -sd /data
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8222/healthz >/dev/null && curl -sf http://127.0.0.1:8222/jsz >/dev/null; then
              echo "NATS JetStream is up"
              exit 0
            fi
            sleep 1
          done
          docker logs nats || true
          echo "NATS did not become healthy" >&2
          exit 1

      - name: Vet
        run: go vet ./...

      - name: Lint
        # v6 + "latest" installs golangci-lint v1 (Go ≤1.24 binary), which cannot
        # lint modules with `go 1.25`. Action v8 + golangci-lint v2.15+ is built with Go ≥1.25.
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

      - name: Run migrations
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          migrate -path migrations -database "$DATABASE_URL" up

      - name: Test
        run: go test ./... -v -race

      - name: Build
        run: make build

  vulncheck:
    # Known vulnerabilities in the code paths Relay actually calls.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint api/openapi.yaml
        run: npx --yes @redocly/cli@1 lint api/openapi.yaml

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --build-arg VERSION=ci --build-arg COMMIT=${{ github.sha }} -t relay:ci .
      - name: Smoke test
        run: |
          docker run --rm relay:ci --version
          docker run --rm --entrypoint /usr/local/bin/relayctl relay:ci version
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgres://relay:relay@localhost:5432/relay?sslmode=disable
      TEST_DATABASE_URL: postgres://relay:relay@localhost:5432/relay?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Lint
        # v6 + "latest" installs golangci-lint v1 (Go ≤1.24 binary), which cannot
        # lint modules with `go 1.25`. Action v8 + golangci-lint v2.15+ is built with Go ≥1.25.
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

      - name: Run migrations
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          migrate -path migrations -database "$DATABASE_URL" up

      - name: Test
        run: go test ./... -v -race

      - name: Build
        run: |
          go build -o relay ./cmd/api
          go build -o relayctl ./cmd/relayctl

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t relay:ci .
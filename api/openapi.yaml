openapi: 3.1.0
info:
  title: Relay API
  version: 1.0.0
  summary: One API for Google Calendar and Outlook.
  description: |
    Relay connects your users' Google and Microsoft (Outlook / Microsoft 365)
    accounts once, keeps their OAuth tokens encrypted and fresh, and serves
    their calendar events in one normalized shape.

    **Authentication.** Every `/v1` route except the OAuth callback and the
    provider webhook endpoints requires `Authorization: Bearer <api key>`.
    Keys look like `rly_live_…` or `rly_test_…` and are issued with
    `relayctl tenant create`. Any key problem answers the same
    `401 {"error":"unauthorized"}`. Webhooks are public; each subscription
    has its own secret (Google channel token, Graph `clientState`), checked
    in constant time. A wrong secret is `401` and is not enqueued.

    **Tenancy.** Everything is scoped to the tenant that owns the key. An
    account of another tenant is indistinguishable from one that does not
    exist (`404 not_found`).

    **Errors.** Error bodies are `{"error": "<code>"}`; query validation errors
    add a human-readable `detail`. Every response carries `X-Request-ID`.
  license:
    name: MIT
    identifier: MIT
  contact:
    name: Relay on GitHub
    url: https://github.com/sebasBetancourt/Relay
servers:
  - url: http://localhost:8080
    description: Local (docker compose up)
security:
  - apiKey: []
tags:
  - name: Health
    description: Probes for orchestrators (no API key).
  - name: Tenant
    description: The tenant behind the API key.
  - name: Connect
    description: Link a Google or Microsoft account to the calling tenant (OAuth 2.0 authorization code + PKCE).
  - name: Accounts
    description: The tenant's connected provider accounts.
  - name: Events
    description: Calendar events, normalized across providers.
  - name: Webhooks
    description: |
      Public push endpoints. Google and Microsoft call these when a calendar
      changes. Relay verifies the per-subscription secret, enqueues a sync
      job and responds without calling the provider. Absent when
      `WEBHOOK_BASE_URL` is unset.

paths:
  /healthz:
    get:
      tags: [Health]
      operationId: healthz
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: The process is up.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            text/plain:
              schema: { type: string, const: ok }

  /readyz:
    get:
      tags: [Health]
      operationId: readyz
      summary: Readiness probe (database reachable)
      security: []
      responses:
        "200":
          description: Ready to serve traffic.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            text/plain:
              schema: { type: string, const: ready }
        "503":
          description: The database is unreachable.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            text/plain:
              schema: { type: string }

  /v1/me:
    get:
      tags: [Tenant]
      operationId: getMe
      summary: The tenant that owns the API key
      description: The simplest end-to-end check that a key works.
      responses:
        "200":
          description: The calling tenant.
          headers:
            RateLimit: { $ref: "#/components/headers/RateLimit" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/connect/{provider}:
    get:
      tags: [Connect]
      operationId: startConnect
      summary: Start connecting a provider account
      description: |
        Creates a one-time `state` (valid 10 minutes) and a PKCE verifier,
        then sends the user to the provider's consent screen. Browsers cannot
        send your API key, so call this from your backend:

        - default: `302` with `Location` set to the consent URL;
        - with `Accept: application/json`: `200` with the URL in the body, to
          hand to your user's browser.

        Reading is always included. `features=calendar.write` also asks for
        the scope that writes events. Connecting the same account again with
        it upgrades the account in place.
      parameters:
        - $ref: "#/components/parameters/Provider"
        - { name: features, in: query, description: Comma-separated optional capabilities., schema: { type: string, enum: [calendar.write] } }
      responses:
        "200":
          description: Consent URL (when `Accept` includes `application/json`).
          headers:
            RateLimit: { $ref: "#/components/headers/RateLimit" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                required: [authorization_url]
                properties:
                  authorization_url:
                    type: string
                    format: uri
                    examples: ["https://login.microsoftonline.com/common/oauth2/v2.0/authorize?client_id=…&code_challenge=…&state=…"]
        "302":
          description: Redirect to the provider's consent screen.
          headers:
            RateLimit: { $ref: "#/components/headers/RateLimit" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            Location:
              description: The consent URL.
              schema: { type: string, format: uri }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
        "400":
          description: |
            - `unsupported_provider`: unknown, or not configured on this deployment.
            - `invalid_query`: an unknown name in `features`.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/QueryError"
              example: { error: unsupported_provider }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/oauth/{provider}/callback:
    get:
      tags: [Connect]
      operationId: oauthCallback
      summary: OAuth callback (called by the provider through the browser)
      description: |
        Public: the browser returns here from the consent screen without an API
        key. Security comes from the one-time `state`. Relay exchanges the
        code (with the PKCE verifier), checks the calendar scope, identifies
        the account, encrypts the tokens and stores the account. Reloading
        the same URL answers `400 invalid_state`.
      security: []
      parameters:
        - $ref: "#/components/parameters/Provider"
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code, in: query, description: Present when the user accepted., schema: { type: string } }
        - { name: error, in: query, description: Present when the user declined (e.g. `access_denied`)., schema: { type: string } }
      responses:
        "200":
          description: The account is connected (or reconnected; the `account_id` is stable).
          headers:
            RateLimit: { $ref: "#/components/headers/RateLimit" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                required: [status, provider, account_id]
                properties:
                  status: { type: string, const: connected }
                  provider: { $ref: "#/components/schemas/Provider" }
                  account_id: { type: string, format: uuid }
                  email: { type: string, format: email, description: Present when the provider returned one. }
        "400":
          description: |
            - `invalid_request`: missing `state`, or missing both `code` and `error`.
            - `unsupported_provider`
            - `invalid_state`: unknown, already used or expired. Start a new connect.
            - `access_denied`: the user declined.
            - `exchange_failed`: the provider rejected the code.
            - `insufficient_scope`: the user unchecked the calendar permission.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`account_already_connected`: the provider account belongs to another tenant."
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/ProviderError" }

  /v1/webhooks/google:
    post:
      tags: [Webhooks]
      operationId: googleWebhook
      summary: Google Calendar push notification
      description: |
        Public. Google sends `X-Goog-Channel-Token`, which Relay compares to
        the stored hash in constant time. `X-Goog-Resource-State: sync` is the
        initial confirmation and is ignored (`200`, nothing queued). Any other
        state enqueues `relay.sync.account` and answers `202`. An unknown
        channel is `200` and is not queued. Relay does not call Google in this
        request.
      security: []
      parameters:
        - { name: X-Goog-Channel-ID, in: header, required: true, schema: { type: string } }
        - { name: X-Goog-Channel-Token, in: header, required: true, schema: { type: string } }
        - { name: X-Goog-Resource-State, in: header, required: true, schema: { type: string, enum: [sync, exists, not_exists] } }
        - { name: X-Goog-Message-Number, in: header, schema: { type: string } }
      responses:
        "200":
          description: Sync confirmation, or a channel Relay does not know. Nothing queued.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
        "202":
          description: A sync job was enqueued.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
        "401":
          description: The channel token does not match. Nothing queued.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: The body exceeds 64 KiB.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
        "429": { $ref: "#/components/responses/WebhookThrottled" }
        "503": { $ref: "#/components/responses/WebhookQueueDown" }

  /v1/webhooks/microsoft:
    post:
      tags: [Webhooks]
      operationId: microsoftWebhook
      summary: Microsoft Graph change notification
      description: |
        Public. While a subscription is being created, Graph calls this URL
        with `validationToken`. Relay answers `200` `text/plain` with that
        token, decoded, and nothing else. Otherwise each item's `clientState`
        is compared to the stored hash in constant time. One sync job is
        enqueued per account (`202`). A bad `clientState` is `401` and
        nothing is queued. Relay does not call Graph in this request.
      security: []
      parameters:
        - { name: validationToken, in: query, schema: { type: string }, description: Present only for the subscription handshake. }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: array
                  items:
                    type: object
                    properties:
                      subscriptionId: { type: string }
                      clientState: { type: string }
                      changeType: { type: string }
                      resource: { type: string }
      responses:
        "200":
          description: |
            Handshake: `text/plain` body is exactly the decoded `validationToken`.
            Or every notification was for an unknown subscription.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            text/plain:
              schema: { type: string }
        "202":
          description: At least one sync job was enqueued.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
        "400":
          description: The body is not JSON. Nothing queued.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
        "401":
          description: A `clientState` does not match. Nothing queued.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: The body exceeds 64 KiB.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
        "429": { $ref: "#/components/responses/WebhookThrottled" }
        "503": { $ref: "#/components/responses/WebhookQueueDown" }

  /v1/webhooks/microsoft/lifecycle:
    post:
      tags: [Webhooks]
      operationId: microsoftLifecycleWebhook
      summary: Microsoft Graph subscription lifecycle notification
      description: |
        Public. `reauthorizationRequired` enqueues a renew,
        `subscriptionRemoved` enqueues a new subscription, and `missed`
        enqueues a sync. The provider is not called in this request.
        The same `validationToken` handshake as `/v1/webhooks/microsoft` applies.
      security: []
      parameters:
        - { name: validationToken, in: query, schema: { type: string } }
      responses:
        "200":
          description: Handshake (the `validationToken`, as on `/v1/webhooks/microsoft`), or nothing to enqueue.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            text/plain:
              schema: { type: string }
        "202":
          description: A renew, resubscribe or sync job was enqueued.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
        "400":
          description: The body is not JSON. Nothing queued.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
        "401":
          description: A `clientState` does not match. Nothing queued.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: The body exceeds 64 KiB.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
        "429": { $ref: "#/components/responses/WebhookThrottled" }
        "503": { $ref: "#/components/responses/WebhookQueueDown" }

  /v1/accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: List the tenant's connected accounts
      description: Never includes tokens. Ordered by connection time; pass `next_page_token` back as `page_token` until it is absent.
      parameters:
        - { name: max_results, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: page_token, in: query, description: Opaque `next_page_token` from the previous page., schema: { type: string } }
      responses:
        "200":
          description: One page of accounts.
          headers:
            RateLimit: { $ref: "#/components/headers/RateLimit" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
            Cache-Control: { $ref: "#/components/headers/PrivateNoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountsPage" }
        "400": { $ref: "#/components/responses/InvalidQuery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/accounts/{id}:
    delete:
      tags: [Accounts]
      operationId: disconnectAccount
      summary: Disconnect an account
      description: |
        Deletes the account's tokens and marks it `disconnected`. Google tokens
        are also revoked at Google (best effort). Idempotent; connecting the
        same provider account again reactivates it.
      parameters:
        - $ref: "#/components/parameters/AccountID"
      responses:
        "204":
          description: Disconnected (or already was).
          headers:
            RateLimit: { $ref: "#/components/headers/RateLimit" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/calendars/{id}/events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: List events of a connected account's primary calendar
      description: |
        Google and Outlook events in one shape. Recurring events are expanded;
        cancelled occurrences are dropped. Access tokens are refreshed
        silently when they expire.

        Paging: follow `next_page_token` until it is absent. A page may hold
        fewer than `max_results` events, but never zero unless it is the last.
        `page_token` carries the first page's window and size, so other query
        parameters are ignored with it.
      parameters:
        - $ref: "#/components/parameters/AccountID"
        - { name: time_min, in: query, description: Start of the window (RFC 3339). Defaults to now., schema: { type: string, format: date-time } }
        - { name: time_max, in: query, description: End of the window (RFC 3339). Defaults to `time_min` + 30 days; at most 366 days after `time_min`., schema: { type: string, format: date-time } }
        - { name: max_results, in: query, schema: { type: integer, minimum: 1, maximum: 250, default: 50 } }
        - { name: page_token, in: query, description: Opaque `next_page_token` from the previous page., schema: { type: string, maxLength: 4096 } }
      responses:
        "200":
          description: One page of events.
          headers:
            RateLimit: { $ref: "#/components/headers/RateLimit" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
            Cache-Control: { $ref: "#/components/headers/PrivateNoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventsPage" }
        "400": { $ref: "#/components/responses/InvalidQuery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            - `account_revoked`: the provider no longer accepts the account's refresh token (access removed, password changed, MFA required). Reconnect.
            - `account_disconnected`: the tenant disconnected it. Reconnect.
            - `calendar_unavailable`: a Microsoft account without an Outlook mailbox.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: |
            - `rate_limited`: this tenant's budget is spent.
            - `provider_rate_limited`: the provider is throttling.

            Retry after `Retry-After` seconds.
          headers:
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
            RateLimit: { $ref: "#/components/headers/RateLimit" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/ProviderError" }
    post:
      tags: [Events]
      operationId: createEvent
      summary: Create an event
      description: |
        The same body for both providers. Relay translates the time zone and
        the recurrence, and refuses what it cannot translate exactly. Needs an
        account connected with `features=calendar.write`.

        Attendees receive real invitations from the provider.
      parameters:
        - $ref: "#/components/parameters/AccountID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventInput" }
      responses:
        "201":
          description: Created. A replay of an `Idempotency-Key` returns the same body with `Idempotent-Replayed`.
          headers:
            RateLimit: { $ref: "#/components/headers/RateLimit" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
            Cache-Control: { $ref: "#/components/headers/PrivateNoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/InvalidEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WriteConflict" }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "422": { $ref: "#/components/responses/IdempotencyKeyReused" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/ProviderError" }

  /v1/calendars/{id}/events/{event_id}:
    patch:
      tags: [Events]
      operationId: updateEvent
      summary: Update an event or a whole series
      description: |
        Only the fields sent change. `start` and `end` travel together. A
        single occurrence cannot be edited; use the series id returned on create.
      parameters:
        - $ref: "#/components/parameters/AccountID"
        - $ref: "#/components/parameters/EventID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - { name: If-Match, in: header, description: The event's `version`. Refuses the edit if the event changed since., schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventPatch" }
      responses:
        "200":
          description: The updated event.
          headers:
            RateLimit: { $ref: "#/components/headers/RateLimit" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
            Cache-Control: { $ref: "#/components/headers/PrivateNoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/InvalidEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WriteConflict" }
        "412":
          description: "`version_conflict`: the event changed since this `version` was read."
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: version_conflict }
        "413": { $ref: "#/components/responses/BodyTooLarge" }
        "422": { $ref: "#/components/responses/IdempotencyKeyReused" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/ProviderError" }
    delete:
      tags: [Events]
      operationId: deleteEvent
      summary: Delete an event or a whole series
      description: Attendees are notified by the provider. A single occurrence cannot be deleted.
      parameters:
        - $ref: "#/components/parameters/AccountID"
        - $ref: "#/components/parameters/EventID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Deleted.
          headers:
            RateLimit: { $ref: "#/components/headers/RateLimit" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
        "400": { $ref: "#/components/responses/InvalidEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WriteConflict" }
        "422": { $ref: "#/components/responses/IdempotencyKeyReused" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/ProviderError" }

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: "rly_live_… | rly_test_…"
      description: Tenant API key from `relayctl tenant create`. Test keys only work on `RELAY_ENV=test` deployments and live keys on `live`.

  parameters:
    Provider:
      name: provider
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Provider" }
    EventID:
      name: event_id
      in: path
      required: true
      description: The event id. Use the series id returned on create for a recurring event.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Retrying with the same key and body returns the stored answer for 24 hours instead of writing again.
      schema: { type: string, maxLength: 255 }
    AccountID:
      name: id
      in: path
      required: true
      description: The `account_id` returned by the OAuth callback.
      schema: { type: string, format: uuid }

  headers:
    IdempotentReplayed:
      description: Present and `true` when this is the stored answer to an earlier request.
      schema: { type: string, const: "true" }
    RequestID:
      description: Request id, echoed from the request's `X-Request-ID` or generated. Quote it in bug reports.
      schema: { type: string }
    NoStore:
      schema: { type: string, const: no-store }
    RateLimit:
      description: Budget left and seconds until it refills (draft-ietf-httpapi-ratelimit-headers).
      schema: { type: string, examples: ['"tenant";r=99;t=1'] }
    RateLimitPolicy:
      description: The applied quota per 60 second window. Policy `tenant` or `ip`.
      schema: { type: string, examples: ['"tenant";q=600;w=60'] }
    RetryAfter:
      description: Seconds to wait before retrying. Always at least 1.
      schema: { type: integer, minimum: 1 }
    PrivateNoStore:
      schema: { type: string, const: "private, no-store" }

  responses:
    WebhookThrottled:
      description: Too many requests from this address.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        text/plain:
          schema: { type: string }
    WebhookQueueDown:
      description: The job could not be enqueued. The provider should retry.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        text/plain:
          schema: { type: string }
    InvalidEvent:
      description: |
        Nothing was sent to the provider.

        - `invalid_event` or `invalid_body`: the body is wrong.
        - `invalid_idempotency_key`: the key is longer than 255 characters.
        - `unsupported_recurrence`: the providers cannot represent it identically, or the event is a single occurrence.
        - `unsupported_timezone`: the IANA zone has no Windows equivalent in CLDR.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/EventError" }
          example: { error: unsupported_recurrence, detail: "until and count cannot be combined" }
    InsufficientScope:
      description: The account was connected read-only. Send the user through `reconnect_url`.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/InsufficientScopeError" }
    WriteConflict:
      description: |
        - `idempotency_in_progress`: the first request with this key is still running; retry after `Retry-After`.
        - `account_revoked`, `account_disconnected` or `calendar_unavailable`: reconnect, as for reads.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    IdempotencyKeyReused:
      description: This `Idempotency-Key` was used with a different route or body.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: idempotency_key_reused }
    BodyTooLarge:
      description: The body exceeds 64 KiB.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: body_too_large }
    Unauthorized:
      description: Missing, malformed, unknown, revoked or wrong-environment API key. Always the same body.
      headers:
        WWW-Authenticate:
          schema: { type: string, examples: ['Bearer realm="relay"'] }
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: unauthorized }
    RateLimited:
      description: |
        `rate_limited`: the budget is spent. Authenticated requests count per
        tenant. The OAuth callback and requests without a valid key count per IP.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        RateLimit: { $ref: "#/components/headers/RateLimit" }
        RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: rate_limited }
    NotFound:
      description: No such account for this tenant (including other tenants' accounts).
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: not_found }
    InvalidQuery:
      description: A query parameter is invalid.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/QueryError" }
          example: { error: invalid_query, detail: "max_results must be an integer between 1 and 250" }
    ProviderError:
      description: |
        - `provider_unavailable`: the provider is down or timed out.
        - `provider_error`: unexpected provider response.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: provider_unavailable }
    InternalError:
      description: Relay failed (database, decryption…). Logged with the request id.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: internal_error }

  schemas:
    Provider:
      type: string
      enum: [google, microsoft]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Machine-readable error code.

    QueryError:
      type: object
      required: [error, detail]
      properties:
        error: { type: string, const: invalid_query }
        detail: { type: string }

    EventError:
      type: object
      required: [error, detail]
      properties:
        error:
          type: string
          enum: [invalid_body, invalid_event, invalid_idempotency_key, unsupported_recurrence, unsupported_timezone]
        detail: { type: string }

    Tenant:
      type: object
      required: [id, name, key_prefix]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        key_prefix:
          type: string
          description: Public, non-secret start of the key used, for logs and UIs.
          examples: [rly_test_AbCdEfGh]

    Account:
      type: object
      required: [id, provider, status, connected_at]
      properties:
        id: { type: string, format: uuid }
        provider: { $ref: "#/components/schemas/Provider" }
        email: { type: string, format: email }
        status:
          type: string
          enum: [active, revoked, disconnected, error]
        connected_at: { type: string, format: date-time }

    AccountsPage:
      type: object
      required: [accounts]
      properties:
        accounts:
          type: array
          items: { $ref: "#/components/schemas/Account" }
        next_page_token:
          type: string
          description: Absent on the last page.

    Organizer:
      type: object
      properties:
        email: { type: string }
        name: { type: string }

    Event:
      type: object
      required: [id, title, start, end, all_day, provider]
      properties:
        id: { type: string, description: The provider's event id. }
        title: { type: string, description: Empty when the event has no title. }
        start:
          type: string
          description: RFC 3339 for timed events (Outlook in UTC), `YYYY-MM-DD` for all-day events.
          examples: ["2026-10-20T14:00:00Z", "2026-10-21"]
        end:
          type: string
          description: Same format as `start`; exclusive for all-day events.
        timezone:
          type: string
          description: IANA zone of a timed event (Outlook's Windows zones are mapped). Absent for all-day events or unknown zones.
          examples: [America/Bogota]
        all_day: { type: boolean }
        location: { type: string }
        organizer: { $ref: "#/components/schemas/Organizer" }
        provider: { $ref: "#/components/schemas/Provider" }
        version:
          type: string
          description: Changes with every edit. Send it as `If-Match` on PATCH.

    Recurrence:
      type: object
      description: The subset of RRULE both providers represent identically.
      required: [freq]
      properties:
        freq: { type: string, enum: [DAILY, WEEKLY, MONTHLY, YEARLY] }
        interval: { type: integer, minimum: 1, default: 1 }
        by_day:
          type: array
          description: WEEKLY only. Must include the event's start day; defaults to it.
          items: { type: string, enum: [MO, TU, WE, TH, FR, SA, SU] }
        until:
          type: string
          format: date
          description: Last date, inclusive, in the event's zone. Not with `count`.
        count: { type: integer, minimum: 1 }

    EventInput:
      type: object
      required: [start, end]
      properties:
        title: { type: string }
        location: { type: string }
        description: { type: string, description: Plain text. }
        start:
          type: string
          description: RFC 3339 with an offset, or `YYYY-MM-DD` with `all_day`.
          examples: ["2026-11-02T09:00:00-05:00", "2026-11-02"]
        end:
          type: string
          description: Same format as `start`; exclusive for all-day events.
        timezone:
          type: string
          description: IANA zone. Required for timed events.
          examples: [America/Bogota]
        all_day: { type: boolean, default: false }
        attendees:
          type: array
          description: Bare email addresses. They receive real invitations.
          items: { type: string, format: email }
        recurrence: { $ref: "#/components/schemas/Recurrence" }

    EventPatch:
      type: object
      description: Same fields as `EventInput`, all optional. `start` and `end` go together, and `recurrence` needs both.
      properties:
        title: { type: string }
        location: { type: string }
        description: { type: string }
        start: { type: string }
        end: { type: string }
        timezone: { type: string }
        all_day: { type: boolean }
        attendees:
          type: array
          description: Replaces the whole list.
          items: { type: string, format: email }
        recurrence: { $ref: "#/components/schemas/Recurrence" }

    InsufficientScopeError:
      type: object
      required: [error, required_scopes, reconnect_url]
      properties:
        error: { type: string, const: insufficient_scope }
        required_scopes:
          type: array
          items: { type: string }
        reconnect_url:
          type: string
          description: Call it with your API key, as `/v1/connect`, and send the user to the consent screen.
          examples: ["/v1/connect/google?features=calendar.write"]

    EventsPage:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        next_page_token:
          type: string
          description: Absent on the last page.
